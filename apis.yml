name: Crabi
description: Crabi is a Mexican digital auto-insurance company (insurtech) offering fully online
  vehicle policies purchasable in about fifteen minutes from a mobile device. Coverage spans
  material damage, theft, third-party civil liability, medical expenses, and roadside and legal
  assistance across 27 Mexican states, sold and serviced through its mobile apps, online quoter
  (cotizador), and customer login portal. The company is regulated in Mexico by the CNSF and
  CONDUSEF and is a portfolio company of 500 Global. Crabi publishes no public developer API,
  documentation, or SDKs; this profile captures its identity and public web surface.
